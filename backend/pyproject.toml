[project]
name = "agrimart-backend"
version = "2.0.0"
description = "AgriMart FastAPI Cooperative Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "google-auth>=2.20.0",
    "google-genai>=1.0.0",
    "supabase>=2.7.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
]

[tool.vercel]
entrypoint = "main:app"
